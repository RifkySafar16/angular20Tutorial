<table style="width:100%"> 

    <tr>
        <td>
            {{ courseName }}
        </td>
        <td>
            {{ productPrice }}
        </td>
        <td>
            <span>{{ courseName }}</span>
        </td>
    </tr>

    <tr>
        <td>
            <input type="text" value="{{ courseName }}" />
        </td>
        <td>
            <input [type]="inputType" [maxLength]="maxLength" [minLength]="minChar"/>
        </td>
        <td>
            <p [class]="myClassName">This is a paragraph</p>
        </td>
    </tr>

    <tr>
        <td>
            <button (click)="showWelcomeMessage()">Show Welcome Message</button>
        </td>
        <td>
            <button (click)="changeCourseName()">Change Course Name</button>
        </td>
        <td>
            <select (change)="onCourseChange()">
                <option value="Angular">Angular</option>
                <option value="React">React</option>
                <option value="Vue">Vue</option>
            </select>
        </td>
    </tr>
    <tr>
        <td>
            <input type="text" [(ngModel)]="courseName" />
        </td>
    </tr>

</table>
